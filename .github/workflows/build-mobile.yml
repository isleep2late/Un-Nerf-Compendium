# Builds BOTH PKHaX mobile targets on ONE GitHub-hosted macOS runner and
# uploads each as a downloadable artifact:
#   - Android : net10.0-android -> com.unnerf.pkhax-Signed.apk   (debug-key signed, sideload-ready)
#   - iOS     : net10.0-ios     -> PKHaX.ipa                     (ad-hoc signed for your registered iPhone)
#
# This is the "eas build --platform all" equivalent: push (or click Run workflow) -> both apps come out.
# iOS is built here because Apple only allows iOS binaries to be produced on macOS; you never need a Mac
# of your own. See PKHaX-Mobile/docs/ios-cloud-build.md for the one-time signing setup and the secrets.
#
# Required repository secrets (Settings > Secrets and variables > Actions) — iOS only:
#   IOS_CERTIFICATE_P12_BASE64        base64 of your Apple Distribution .p12
#   IOS_CERTIFICATE_P12_PASSWORD      the password protecting that .p12
#   IOS_PROVISIONING_PROFILE_BASE64   base64 of the Ad Hoc .mobileprovision
#   IOS_PROVISIONING_PROFILE_NAME     the profile's Name (used for CodesignProvision)
#   IOS_SIGNING_IDENTITY              e.g. "Apple Distribution: Your Name (TEAMID)"
# (Android here is debug-key signed and needs no secrets. To give the CI APK a stable signature across
#  builds, add a keystore — see the docs — but the recommended Android path is the local build script.)

name: Build PKHaX Mobile

on:
  push:
    branches: [ main ]
    paths: [ 'PKHaX-Mobile/**', 'PKHaX/PKHeX.Core/**', '.github/workflows/build-mobile.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: PKHaX-Mobile/src/PKHaX.Mobile.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build:
    # .NET 10's iOS workload (Microsoft.iOS 26.x) requires Xcode 26 — only the macos-26 image ships it.
    # If a build ever fails with "requires Xcode 26.x / current is 26.y", uncomment the Select Xcode step
    # below and set the exact version the error asks for.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout (brings PKHaX-Mobile AND PKHaX/PKHeX.Core in one tree)
        uses: actions/checkout@v4

      # - name: Select Xcode (only if the iOS build complains about an exact version)
      #   run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads (adds the ios and android build packs)
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore "$PROJECT"

      # ----------------------------- ANDROID -----------------------------
      - name: Build Android APK (debug-key signed)
        run: |
          dotnet publish "$PROJECT" -f net10.0-android -c Release \
            -p:AndroidPackageFormats=apk
          mkdir -p artifacts/android
          find PKHaX-Mobile/src/bin/Release/net10.0-android -name '*-Signed.apk' -exec cp {} artifacts/android/ \;
          ls -l artifacts/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pkhax-android-apk
          path: artifacts/android/*.apk
          if-no-files-found: error

      # ------------------------------- iOS -------------------------------
      - name: Import signing certificate into a temp keychain
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="$(openssl rand -base64 16)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN"

      - name: Install Ad Hoc provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$DIR/pkhax.mobileprovision"

      - name: Build & sign iOS IPA (ad-hoc)
        run: |
          dotnet publish "$PROJECT" -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="${{ secrets.IOS_SIGNING_IDENTITY }}" \
            -p:CodesignProvision="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}"
          mkdir -p artifacts/ios
          find PKHaX-Mobile/src/bin/Release/net10.0-ios -name '*.ipa' -exec cp {} artifacts/ios/ \;
          ls -l artifacts/ios

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pkhax-ios-ipa
          path: artifacts/ios/*.ipa
          if-no-files-found: error
